limit_req_zone $binary_remote_addr zone=brp_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rule.13.251.6.169.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
