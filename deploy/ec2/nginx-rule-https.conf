limit_req_zone $binary_remote_addr zone=brp_login:10m rate=5r/m;

server {
    listen 80;
    listen [::]:80;
    server_name rule.13.251.6.169.nip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name rule.13.251.6.169.nip.io;

    ssl_certificate /etc/letsencrypt/live/rule.13.251.6.169.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rule.13.251.6.169.nip.io/privkey.pem;
    ssl_session_cache shared:brp_tls:10m;
    ssl_session_timeout 1d;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api/v1/auth/login {
        limit_req zone=brp_login burst=4 nodelay;
        proxy_pass http://127.0.0.1:8180;
        include /etc/nginx/snippets/brp-proxy-headers.conf;
    }

    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:8180;
        include /etc/nginx/snippets/brp-proxy-headers.conf;
    }
}
